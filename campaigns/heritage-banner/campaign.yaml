  - {id: hb-019, topic: what a familiar park bench or front step may mean to a community, pillar_id: local-history, theme_id: gathering-places}
  - {id: hb-020, topic: inviting multiple perspectives on a shared local place, pillar_id: local-history, theme_id: gathering-places}
  - {id: hb-021, topic: crediting the person who supplied a community story, pillar_id: community-identity, theme_id: ethical-sharing}
