  - {id: hb-031, topic: storing a voice note together with who spoke and when, pillar_id: community-identity, theme_id: ethical-sharing}
  - {id: hb-032, topic: one ordinary detail worth carrying into the next generation, pillar_id: intergenerational-wisdom, theme_id: sayings-and-lessons}
stop_phrases:
  - Share a memory if this brings one to mind.
  - Ask one careful question today.
  - The Heritage Banner
metadata:
  brand_id: heritage-banner
  legacy_campaign_id: heritage-banner-facebook
  legacy_source: campaigns/heritage-banner/marketing-plan.json
  recovered_task_receipts: 3
  hashtags: ["#TheHeritageBanner", "#CommunityStories"]
  mpt_defaults:
    video_concat_mode: sequential
    video_transition_mode: null
    video_clip_duration: 5
    match_materials_to_script: true
    video_count: 1
