  - {id: hb-002, topic: a recipe craft or routine that families continue to share, pillar_id: traditions, theme_id: shared-routines}
  - {id: hb-003, topic: asking before sharing a story that belongs partly to someone else, pillar_id: community-identity, theme_id: ethical-sharing}
  - {id: hb-004, topic: keeping a simple backup of story notes and their context, pillar_id: community-identity, theme_id: ethical-sharing}
  - {id: hb-005, topic: the story behind a neighbor who quietly helped a community, pillar_id: local-history, theme_id: local-helpers}
  - {id: hb-006, topic: three gentle questions to ask when recording a family or community story, pillar_id: family-memory, theme_id: family-questions}
  - {id: hb-007, topic: introducing The Heritage Banner as an invitation to preserve shared stories, pillar_id: community-identity, theme_id: community-stories}
  - {id: hb-008, topic: the note written on the back of an old photograph, pillar_id: family-memory, theme_id: family-artifacts}
