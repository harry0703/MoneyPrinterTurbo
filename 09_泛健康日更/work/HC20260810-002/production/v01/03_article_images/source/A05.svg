<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#FFF8EC"/><text x="72" y="204" font-family="Noto Sans SC" font-size="36" font-weight="700" fill="#087F78" text-anchor="start">生活节奏看得见</text><path d="M72 232h128" stroke="#10BFAE" stroke-width="8"/><text x="900" y="204" font-family="Noto Sans SC" font-size="34" font-weight="700" fill="#087F78" text-anchor="end">05/07</text><rect x="72" y="300" width="828" height="260" rx="24" fill="#F5C79E"/><g><path d="M738.3 399.1L738.3 479.6L825.7 479.6L825.7 429M738.3 479.6L738.3 527.9M825.7 479.6L825.7 527.9" stroke="#087F78" stroke-width="18.4" fill="none" stroke-linecap="round"/><circle cx="834.9" cy="399.1" r="23" fill="#F5C79E"/></g><text x="72" y="670" font-family="Noto Sans SC" font-size="38" font-weight="700" fill="#087F78" text-anchor="start">观察 三</text><text x="72" y="770" font-family="Noto Sans SC" font-size="72" font-weight="700" fill="#24313D"><tspan x="72" dy="0">看回座感受</tspan></text><text x="72" y="1010" font-family="Microsoft YaHei" font-size="42" font-weight="400" fill="#24313D"><tspan x="72" dy="0">留意清醒与专注，只记录当时体验。</tspan></text><path d="M110 1292C260 1212 430 1308 610 1232S820 1188 900 1210" fill="none" stroke="#10BFAE" stroke-width="28" stroke-linecap="round"/><circle cx="110" cy="1292" r="22" fill="#F5C79E"/><circle cx="900" cy="1210" r="22" fill="#087F78"/><rect x="72" y="1320" width="828" height="96" rx="24" fill="#087F78"/><text x="108" y="1384" font-family="Noto Sans SC" font-size="38" font-weight="700" fill="#FFF8EC" text-anchor="start">不预设结果，保留差异</text><text x="72" y="1488" font-family="Microsoft YaHei" font-size="36" font-weight="600" fill="#24313D" text-anchor="start">留作个人生活观察 · 安全优先</text><path d="M72 1520h828" stroke="#F5C79E" stroke-width="4"/><circle cx="836" cy="1664" r="104" fill="#F5C79E"/><path d="M808 1664c28-48 60-48 88 0" stroke="#087