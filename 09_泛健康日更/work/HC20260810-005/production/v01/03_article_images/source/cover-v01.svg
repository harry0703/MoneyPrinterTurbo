<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#FFF8EC"/><rect width="1080" height="1920" fill="#087F78"/><text x="96" y="210" font-family="Noto Sans SC" font-size="36" font-weight="700" fill="#FFF8EC" text-anchor="start">生活节奏看得见</text><path d="M96 242h152" stroke="#10BFAE" stroke-width="8"/><text x="96" y="500" font-family="Noto Sans SC" font-size="78" font-weight="700" fill="#FFF8EC"><tspan x="96" dy="0">下午卡住简短</tspan><tspan x="96" dy="92">重启</tspan></text><g><rect x="72" y="700" width="828" height="600" rx="24" fill="#F5C79E"/><path d="M152 792h330v330H152z" fill="#FFF8EC" stroke="#087F78" stroke-width="12"/><path d="M262 792v330M372 792v330" stroke="#10BFAE" stroke-width="10"/><circle cx="317" cy="957" r="58" fill="#10BFAE" opacity="0.72"/><path d="M602 1090h180v72H602zM626 1162v72M758 1162v72" fill="#087F78" stroke="#087F78" stroke-width="12" stroke-linecap="round"/><ellipse cx="692" cy="1228" rx="116" ry="34" fill="#FFF8EC"/><ellipse cx="772" cy="810" rx="54" ry="30" fill="#087F78" transform="rotate(-28 772 810)"/></g><rect x="96" y="1330" width="756" height="154" rx="24" fill="#F5C79E"/><text x="128" y="1388" font-family="Microsoft YaHei" font-size="38" font-weight="400" fill="#24313D"><tspan x="128" dy="0">下午卡住时，把计划缩成一次短暂</tspan><tspan x="128" dy="56">停顿。</tspan></text><rect x="96" y="1520" width="756" height="96" rx="24" fill="#FFF8EC"/><text x="128" y="1582" font-family="Noto Sans SC" font-size="38" font-weight="700" fill="#24313D" text-anchor="start">一次观察，留作下次参照</text><path d="M100 1760h600l120-120" fill="none" stroke="#10BFAE" stroke-width="28" stroke-linecap="round"/><circle cx="824" cy="1636" r="28" fill="#F5C79E"/></svg>