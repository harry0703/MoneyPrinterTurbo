name: 🐛 Bug | Bug Report
description: 오류나 예상치 못한 동작 신고 | Report an error or unexpected behavior
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        **문제를 제출하기 전에 다음 문서를 먼저 읽어 주세요: [Getting Started (English)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README-en.md#system-requirements-)**
        
        **Before submitting an issue, please make sure you've read the following documentation: [Getting Started (English)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README-en.md#system-requirements-).**
        
  - type: textarea
    attributes:
      label: 문제 설명 | Current Behavior
      description: |
        겪은 문제를 설명해 주세요
        Describe the issue you're experiencing
      placeholder: |
        ... 동작을 실행했을 때 프로그램에서 ... 문제가 발생했습니다
        When I perform..., the program shows...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 재현 절차 | Steps to Reproduce
      description: |
        이 문제를 재현하는 방법을 자세히 설명해 주세요
        Describe in detail how to reproduce this issue
      placeholder: |
        1. ... 을(를) 연다
        2. ... 을(를) 클릭한다
        3. ... 오류가 발생한다
        
        1. Open...
        2. Click on...
        3. Error occurs...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 오류 로그 | Error Logs
      description: |
        관련 오류 메시지나 로그를 남겨 주세요 (민감한 정보는 포함하지 마세요)
        Please provide any error messages or logs (be careful not to include sensitive information)
      placeholder: |
        오류 메시지, 로그 또는 스크린샷...
        Error messages, logs, or screenshots...
    validations:
      required: true
  - type: input
    attributes:
      label: Python 버전 | Python Version
      description: |
        사용 중인 Python 버전
        The Python version you're using
      placeholder: v3.13.0, v3.10.0, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: 운영체제 | Operating System
      description: |
        운영체제 정보
        Your operating system information
      placeholder: macOS 14.1, Windows 11, Ubuntu 22.04, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: shipcast 버전 | Version
      description: |
        사용 중인 shipcast 버전
        The version of shipcast you're using
      placeholder: v1.2.2, etc.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 추가 정보 | Additional Information
      description: |
        문제 해결에 도움이 될 만한 그 밖의 정보 (스크린샷, 영상 등)
        Any other information that might help solve the issue (screenshots, videos, etc.)
    validations:
      required: false