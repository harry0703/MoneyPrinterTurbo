name: ✨ Feature Request
description: Suggest a new idea for this project
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    attributes:
      label: Problem Statement
      description: |
        Describe the problem or need you'd like solved
        Please describe the problem you want to solve
      placeholder: |
        While using it, I ran into ...
        I encountered... when using this project
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: |
        Describe a solution or implementation you think would work
        Please describe your suggested solution or implementation
      placeholder: |
        Consider adding a ... feature to solve this problem
        Consider adding... feature to address this issue
    validations:
      required: true