# 설명:
# 1. 주 의존성 출처는 pyproject.toml 로 일원화한다.
# 2. 실행 환경은 uv.lock 으로 고정해, 머신마다 다른 버전 조합이 해석되지 않게 한다.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "shipcast"
version = "1.3.3"
description = "Generate short videos from prompts, local assets, subtitles, and TTS."
readme = "README-en.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.59.1",
    "streamlit-tour==1.1.0",
    "edge-tts==7.2.7",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.86.2",
    "google-genai==2.11.0",
]

[project.optional-dependencies]
# Optional TwelveLabs (https://twelvelabs.io) video-understanding/embedding
# integration. Only needed when `twelvelabs_api_keys` is configured; install
# with `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.2.8",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# WebUI 는 프로젝트 루트를 sys.path 에 먼저 넣어야 app 패키지를 import 할 수 있다.
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# 분기 커버리지를 재면 '코드 줄은 실행됐지만 조건의 다른 분기는 한 번도 검증되지 않은' 경우를
# 잡아낼 수 있어, 줄 커버리지만 재는 것보다 CI 품질 기준선으로 적합하다. CLI 와 WebUI 도
# 프로덕션 진입점이므로, app 서비스 계층·서비스 시작 진입점·Agent 사용자에게 배포하는 Skill
# 스크립트와 함께 집계에 넣어 커버리지가 일부 모듈만 반영하지 않게 한다.
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# Python 3.11 과 3.13 전체 테스트의 실측 분기 커버리지는 모두 70.4% 를 넘는다. 70% 를 안정적인
# 하한선으로 두면 실패 상태, 비동기 업로드 복구, Redis 원자적 갱신 테스트를 고정할 수 있고,
# Python 버전과 운영체제에 따른 소소한 분기 차이에도 여유가 남는다.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# 이 프로젝트는 애플리케이션으로 실행하는 형태가 주이며, 배포 가능한 Python 패키지로 설치하지 않는다.
package = false
