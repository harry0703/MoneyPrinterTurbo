# Notes:
# 1. Main dependency sources are consolidated in pyproject.toml.
# 2. The runtime environment is pinned with uv.lock, so different machines don't resolve different version combinations.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mpt"
version = "1.3.10"
description = "Official MoneyPrinterTurbo package with WebUI and CLI, maintained by harry0703."
readme = "docs/pypi-description.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.66.1",
    # Keep the media-response compatibility test passing with the patched stack.
    "starlette==1.3.1",
    "streamlit-tour==1.1.0",
    "edge-tts==7.3.1",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    # Keep consistent with requirements.txt: PyAV 19 removed a parameter used by Whisper.
    "av<19",
    "toml==0.10.2",
    "imageio-ffmpeg==0.6.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.30",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.103.1",
    "google-genai==2.11.0",
    "pyjwt[crypto]>=2.10.1,<3",
    "filelock>=4.2.1,<5",
    # Shaping and drawing for Arabic-script subtitles (HarfBuzz + FreeType, bundled in the wheel, no system libraries needed).
    "khatt[video]==0.4.0",
]

[project.scripts]
mpt = "app.launcher:main"

[project.urls]
Homepage = "https://github.com/harry0703/MoneyPrinterTurbo"
Issues = "https://github.com/harry0703/MoneyPrinterTurbo/issues"

[project.optional-dependencies]
# Optional TwelveLabs (https://twelvelabs.io) video-understanding/embedding
# integration. Only needed when `twelvelabs_api_keys` is configured; install
# with `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.2.8",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# The WebUI needs the project root added to sys.path before it can import the app package.
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# Branch coverage can catch cases where "the line ran, but the other branch of the condition was never verified",
# making it a better CI quality baseline than line coverage alone. The CLI and WebUI are both production entry points,
# so they're included along with the app service layer, the service entry points and the Skill script published for Agent users,
# so coverage doesn't reflect only some modules.
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# Measured branch coverage of full test runs on Python 3.11 and 3.13 both exceeds 70.4%. Using 70%
# as a stable floor locks in tests for failure states, async publish recovery and atomic Redis updates,
# while leaving headroom for small branch differences across Python versions and operating systems.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app", "webui"]

# Fonts keep the default Chinese/English fonts and the Vietnamese font. The two large alternate weights are left out of the package,
# so the wheel doesn't exceed PyPI's default file size limit; the font files of the source version are unchanged.
[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "app/cli.py"
"config.example.toml" = "app/_assets/config.example.toml"
"resource/fonts/STHeitiMedium.ttc" = "app/_assets/resource/fonts/STHeitiMedium.ttc"
"resource/fonts/MicrosoftYaHeiBold.ttc" = "app/_assets/resource/fonts/MicrosoftYaHeiBold.ttc"
"resource/fonts/BeVietnamPro-Bold.ttf" = "app/_assets/resource/fonts/BeVietnamPro-Bold.ttf"
"resource/fonts/BeVietnamPro-Medium.ttf" = "app/_assets/resource/fonts/BeVietnamPro-Medium.ttf"
"resource/fonts/Charm-Bold.ttf" = "app/_assets/resource/fonts/Charm-Bold.ttf"
"resource/fonts/Charm-Regular.ttf" = "app/_assets/resource/fonts/Charm-Regular.ttf"
"resource/fonts/UTM Kabel KT.ttf" = "app/_assets/resource/fonts/UTM Kabel KT.ttf"
"resource/songs" = "app/_assets/resource/songs"
"resource/public" = "app/_assets/resource/public"

[tool.hatch.build]
exclude = ["**/.DS_Store", "**/__pycache__", "**/*.pyc", "**/.streamlit"]

[tool.hatch.build.targets.sdist]
# Uses an allowlist, preventing local config, credentials, storage, AGENTS.md and the like from getting into the source distribution.
include = [
    "/app", "/cli.py", "/webui", "/config.example.toml", "/pyproject.toml",
    "/uv.lock", "/LICENSE", "/docs/pypi-description.md", "/docs/packaging.md",
    "/test/services/test_packaging.py", "/resource/songs", "/resource/public",
    "/resource/fonts/STHeitiMedium.ttc", "/resource/fonts/MicrosoftYaHeiBold.ttc",
    "/resource/fonts/BeVietnamPro-Bold.ttf", "/resource/fonts/BeVietnamPro-Medium.ttf",
    "/resource/fonts/Charm-Bold.ttf", "/resource/fonts/Charm-Regular.ttf",
    "/resource/fonts/UTM Kabel KT.ttf",
]

[tool.uv]
package = true
# MoviePy 2.2.1 caps Pillow below 12; patched Pillow is required for image decoding.
# Keep this in sync with requirements-security.txt for container/legacy installs.
override-dependencies = ["pillow>=13.0.0,<14"]
