# Notes:
# 1. pyproject.toml is the single source of truth for dependencies.
# 2. The runtime is pinned by uv.lock so different machines resolve identical versions.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "moneyprinterturbo"
version = "1.3.4"
description = "Generate short videos from prompts, local assets, subtitles, and TTS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.59.1",
    "streamlit-tour==1.1.0",
    "edge-tts==7.2.7",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.86.2",
    "google-genai==2.11.0",
]

[project.optional-dependencies]
# Optional TwelveLabs (https://twelvelabs.io) video-understanding/embedding
# integration. Only needed when `twelvelabs_api_keys` is configured; install
# with `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.2.8",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# The WebUI must prepend the project root to sys.path before importing the app package.
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# Branch coverage detects "the line ran, but the other branch of the condition was never
# verified", which is a better CI quality baseline than line coverage alone. The CLI and
# WebUI are production entry points, so they are counted together with the app service
# layer, the service entry point, and the Skill script published for Agent users.
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# Full test runs on Python 3.11 and 3.13 both measured branch coverage above 70.4%.
# A stable 70% floor locks in the failed-state, async publish recovery, and Redis atomic
# update tests while leaving headroom for small branch differences across Python versions
# and operating systems.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# This project runs as an application and is not published as an installable Python package.
package = false
